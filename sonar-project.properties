# Local / self-hosted SonarQube scanner config for THIS repo only.
# Does not upload source until you run sonar-scanner against a server you already operate.
# Never commit SONAR_TOKEN. Host and token live in gitignored .env.
sonar.projectKey=floorwise
sonar.projectName=Floorwise
sonar.sources=src,server
sonar.tests=src,server
sonar.test.inclusions=**/*.test.ts
sonar.exclusions=dist/**,node_modules/**,public/maps/**,data/**
sonar.sourceEncoding=UTF-8
# Optional when you generate coverage locally:
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
