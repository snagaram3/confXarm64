# Used by Helm (charts/floorwise) and `kubectl apply -k k8s`.
# Host is floorwise.local unless you override it (minikube uses floorwise.$(minikube ip).nip.io).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: floorwise
  namespace: floorwise
  labels:
    app.kubernetes.io/name: floorwise
    app.kubernetes.io/part-of: floorwise
spec:
  ingressClassName: nginx
  rules:
    - host: floorwise.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
