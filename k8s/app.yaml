apiVersion: v1
kind: Service
metadata:
  name: floorwise
  namespace: floorwise
  labels:
    app.kubernetes.io/name: floorwise
    app.kubernetes.io/part-of: floorwise
spec:
  selector:
    app.kubernetes.io/name: floorwise
  ports:
    - name: http
      port: 80
      targetPort: 43181
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: floorwise
  namespace: floorwise
  labels:
    app.kubernetes.io/name: floorwise
    app.kubernetes.io/part-of: floorwise
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: floorwise
  template:
    metadata:
      labels:
        app.kubernetes.io/name: floorwise
        app.kubernetes.io/part-of: floorwise
    spec:
      containers:
        - name: app
          image: floorwise:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 43181
              name: http
          env:
            - name: ELASTICSEARCH_URL
              value: http://elasticsearch:9200
            - name: ELASTICSEARCH_INDEX
              value: floorwise
            - name: PORT
              value: "43181"
            - name: OTEL_SERVICE_NAME
              value: floorwise-api
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: floorwise-otel
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
                  optional: true
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: floorwise-otel
                  key: OTEL_EXPORTER_OTLP_HEADERS
                  optional: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: 43181
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
