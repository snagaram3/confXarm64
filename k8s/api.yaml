apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: floorwise
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: floorwise
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 43181
      targetPort: 43181
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: floorwise
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: floorwise
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: floorwise
    spec:
      containers:
        - name: api
          image: floorwise-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 43181
              name: http
          envFrom:
            - configMapRef:
                name: floorwise-config
            - secretRef:
                name: floorwise-secrets
                optional: true
          env:
            - name: FLOORWISE_SKIP_SEED
              value: "1"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 43181
            initialDelaySeconds: 8
            periodSeconds: 8
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /api/health
              port: 43181
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
