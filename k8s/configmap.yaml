apiVersion: v1
kind: ConfigMap
metadata:
  name: floorwise-config
  namespace: floorwise
  labels:
    app.kubernetes.io/name: floorwise
    app.kubernetes.io/part-of: floorwise
data:
  ELASTICSEARCH_URL: "http://elasticsearch:9200"
  ELASTICSEARCH_INDEX: "floorwise"
  PORT: "43181"
  OTEL_SERVICE_NAME: "floorwise-api"
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  FLOORWISE_SKIP_SEED: "1"
  FLOORWISE_SYNTHETIC_OTEL: "0"
  DASH0_DASHBOARD_URL: "https://app.dash0.com"
  DASH0_API_BASE_URL: ""
  DASH0_DATASET: "default"
  SONAR_HOST_URL: ""
  SONAR_PROJECT_KEY: "floorwise"
  SONAR_ORGANIZATION: ""
  RADAR_UI_URL: ""
