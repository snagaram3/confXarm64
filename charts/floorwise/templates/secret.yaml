{{- if .Values.secrets.create }}
{{- $secretName := include "floorwise.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- if not $existing }}
# Placeholder only. lookup() skips this on upgrade if the Secret already exists
# so filled tokens are not wiped. Do not put real tokens in git or values.yaml.
# kubectl -n {{ .Release.Namespace }} create secret generic {{ $secretName }} \
#   --from-literal=DASH0_AUTH_TOKEN= \
#   --from-literal=OTEL_EXPORTER_OTLP_HEADERS= \
#   --from-literal=SONAR_TOKEN= \
#   --from-literal=RADAR_SECRET_KEY= \
#   --from-literal=RADAR_PUBLISHABLE_KEY= \
#   --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    app.kubernetes.io/name: floorwise
    {{- include "floorwise.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  OTEL_EXPORTER_OTLP_HEADERS: ""
  DASH0_AUTH_TOKEN: ""
  SONAR_TOKEN: ""
  RADAR_SECRET_KEY: ""
  RADAR_PUBLISHABLE_KEY: ""
{{- end }}
{{- end }}
