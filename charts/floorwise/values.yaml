# Floorwise Helm values. Do not put tokens here — use Kubernetes Secrets.
# In-cluster Elasticsearch MUST stay http://elasticsearch:9200 (cluster name floorwise).

nameOverride: ""
fullnameOverride: floorwise

image:
  api: floorwise-api:dev
  web: floorwise-web:dev
  pullPolicy: IfNotPresent

elasticsearch:
  image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
  clusterName: floorwise
  url: http://elasticsearch:9200
  javaOpts: "-Xms512m -Xmx512m"
  persistence:
    size: 4Gi
  resources:
    requests:
      memory: 768Mi
      cpu: 250m
    limits:
      memory: 1536Mi
      cpu: "1"

api:
  replicas: 1
  port: 43181
  skipSeed: "1"
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

web:
  replicas: 1
  resources:
    requests:
      memory: 64Mi
      cpu: 25m
    limits:
      memory: 128Mi
      cpu: 200m

seed:
  # post-install hook. Re-running wipes the floorwise index — do not apply against a live demo.
  enabled: true

config:
  elasticsearchIndex: floorwise
  otelServiceName: floorwise-api
  # HTTP OTLP ingest for this process (not the operator gRPC :4317 URL).
  otelExporterEndpoint: ""
  syntheticOtel: "0"
  dash0:
    # Shown in Tools → Dash0 only when DASH0_AUTH_TOKEN is also present.
    dashboardUrl: "https://app.dash0.com"
    apiBaseUrl: ""
    dataset: default
  sonar:
    hostUrl: ""
    projectKey: floorwise
    organization: ""
  # Skyhook Radar UI (in-cluster). Not api.radar.io.
  radarUiUrl: ""

secrets:
  # Empty placeholders on first install. lookup() skips upgrades so filled tokens stay.
  # Replace via kubectl; never commit tokens.
  create: true
  existingName: floorwise-secrets

ingress:
  enabled: true
  className: nginx
  host: floorwise.local
  annotations: {}
