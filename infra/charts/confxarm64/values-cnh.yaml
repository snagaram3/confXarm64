# Overlay for the Cloud Native Hackathon cluster (team confxarm64).
# Budget: 2 CPU / 4 GiB requests, 4 CPU / 8 GiB limits, 4 PVCs / 20 GiB.
# Host refuses privileged, hostNetwork, hostPath, hostPID.
# Radar is already installed in this cluster — do not helm-install skyhook/radar here.
# Platform URL https://confxarm64.cnh.radarhq.io → Service `app` port 80 in team-confxarm64.

image:
  pullPolicy: IfNotPresent
  # api/web tags live in values-images.yaml (GitHub Action owned).

appService:
  enabled: true

ingress:
  enabled: false

elasticsearch:
  javaOpts: "-Xms384m -Xmx384m"
  persistence:
    size: 4Gi
  resources:
    requests:
      memory: 768Mi
      cpu: 300m
    limits:
      memory: 1536Mi
      cpu: "1"

api:
  resources:
    requests:
      memory: 256Mi
      cpu: 150m
    limits:
      memory: 512Mi
      cpu: 500m

web:
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 200m

config:
  # The live app URL is not the Skyhook Radar control plane. Leave unset (honest not_configured).
  radarUiUrl: ""
  syntheticOtel: "0"
  # Public Dash0 endpoints only (no tokens). Empty defaults in values.yaml
  # would wipe a live ConfigMap patch on the next Argo CD self-heal.
  otelExporterEndpoint: "https://ingress.us-east-1.aws.dash0.com"
  dash0:
    apiBaseUrl: "https://api.us-east-1.aws.dash0.com"
  # Public Elastic Cloud endpoints only (no tokens). API key stays in Secret confxarm64-secrets.
  elasticCloud:
    elasticsearchUrl: "https://confxarm64-f141cd.es.us-central1.gcp.elastic.cloud"
    ingestUrl: "https://confxarm64-f141cd.ingest.us-central1.gcp.elastic.cloud"
    kibanaUrl: "https://confxarm64-f141cd.kb.us-central1.gcp.elastic.cloud"
    mcpUrl: "https://confxarm64-f141cd.kb.us-central1.gcp.elastic.cloud/api/agent_builder/mcp"
    projectAlias: confxarm64-f141cd
    projectId: "f141cd752dcf402aade777317073039e"
    region: gcp-us-central1
    embeddingsInferenceId: confxarm64-jina-embeddings
    rerankInferenceId: confxarm64-jina-rerank
    demoIndex: confxarm64-jina-demo

secrets:
  # Do not let Argo render empty token placeholders. Create/patch confxarm64-secrets by hand.
  create: false
