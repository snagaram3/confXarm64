# Overlay for the Cloud Native Hackathon cluster (team confxarm64).
# Budget: 2 CPU / 4 GiB requests, 4 CPU / 8 GiB limits, 4 PVCs / 20 GiB.
# Host refuses privileged, hostNetwork, hostPath, hostPID.
# Radar is already installed in this cluster — do not helm-install skyhook/radar here.
# Platform URL https://confxarm64.cnh.radarhq.io → Service `app` port 80 in team-confxarm64.

image:
  pullPolicy: IfNotPresent
  # api/web tags live in values-images.yaml (GitHub Action owned).

appService:
  enabled: true

ingress:
  enabled: false

elasticsearch:
  javaOpts: "-Xms384m -Xmx384m"
  persistence:
    size: 4Gi
  resources:
    requests:
      memory: 768Mi
      cpu: 300m
    limits:
      memory: 1536Mi
      cpu: "1"

api:
  resources:
    requests:
      memory: 256Mi
      cpu: 150m
    limits:
      memory: 512Mi
      cpu: 500m

web:
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 200m

config:
  radarUiUrl: "https://confxarm64.cnh.radarhq.io"
  syntheticOtel: "0"
