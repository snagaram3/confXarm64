# confXarm64 Helm values. Do not put tokens here — use Kubernetes Secrets.
# In-cluster Elasticsearch MUST stay http://elasticsearch:9200 (cluster name floorwise).
# CNH overlay: values-cnh.yaml (fits 2 CPU / 4 GiB requests, 4 CPU / 8 GiB limits, 4 PVCs / 20 GiB).

nameOverride: ""
fullnameOverride: confxarm64

image:
  api: floorwise-api:dev
  web: floorwise-web:dev
  pullPolicy: IfNotPresent

elasticsearch:
  image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
  clusterName: floorwise
  url: http://elasticsearch:9200
  javaOpts: "-Xms512m -Xmx512m"
  persistence:
    size: 4Gi
  resources:
    requests:
      memory: 768Mi
      cpu: 250m
    limits:
      memory: 1536Mi
      cpu: "1"

api:
  replicas: 1
  port: 43181
  skipSeed: "1"
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

web:
  replicas: 1
  resources:
    requests:
      memory: 64Mi
      cpu: 25m
    limits:
      memory: 128Mi
      cpu: 200m

# CNH platform routes https://<team>.cnh.radarhq.io to Service `app` port 80.
appService:
  enabled: false

seed:
  # Helm post-install / Argo PostSync. seed.ts skips when the floorwise index already exists.
  enabled: true

config:
  elasticsearchIndex: floorwise
  otelServiceName: confxarm64-api
  # HTTP OTLP ingest for this process (not the operator gRPC :4317 URL).
  otelExporterEndpoint: ""
  syntheticOtel: "0"
  dash0:
    dashboardUrl: "https://app.dash0.com"
    apiBaseUrl: ""
    dataset: default
  sonar:
    hostUrl: ""
    projectKey: floorwise
    organization: ""
  # Skyhook Radar Kubernetes UI (minikube Radar chart). Not this app and not api.radar.io.
  radarUiUrl: ""

secrets:
  # Empty Secret shell (no token values). Argo CD cannot lookup(); empty stringData would wipe
  # kubectl-patched tokens on selfHeal. Operators patch confxarm64-secrets in-cluster.
  create: true
  existingName: confxarm64-secrets

ingress:
  enabled: true
  className: nginx
  host: confxarm64.local
  annotations: {}
