{{- if .Values.appService.enabled }}
# CNH platform routes https://<team>.cnh.radarhq.io to Service `app` port 80.
apiVersion: v1
kind: Service
metadata:
  name: app
  labels:
    app.kubernetes.io/name: app
    {{- include "confxarm64.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: 8080
{{- end }}
