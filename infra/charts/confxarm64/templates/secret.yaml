{{- if .Values.secrets.create }}
{{- $secretName := include "confxarm64.secretName" . }}
# Empty shell only — never put token values here.
# Helm lookup() is skipped by Argo CD (no cluster access at render time), so empty
# stringData would overwrite kubectl-patched DASH0_AUTH_TOKEN / OTEL headers on every
# selfHeal sync. Operators patch keys onto this Secret; Argo ignoreDifferences keeps them.
# kubectl -n {{ .Release.Namespace }} create secret generic {{ $secretName }} \
#   --from-literal=DASH0_AUTH_TOKEN= \
#   --from-literal=OTEL_EXPORTER_OTLP_HEADERS= \
#   --from-literal=SONAR_TOKEN= \
#   --from-literal=RADAR_SECRET_KEY= \
#   --from-literal=RADAR_PUBLISHABLE_KEY= \
#   --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    app.kubernetes.io/name: confxarm64
    {{- include "confxarm64.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
    "argocd.argoproj.io/sync-options": Prune=false,RespectIgnoreDifferences=true
type: Opaque
{{- end }}
