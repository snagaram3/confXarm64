{{- if .Values.seed.enabled }}
# First install seeds the floorwise index. Argo CD remaps Helm post-install to PostSync
# (reruns after every sync). server/seed.ts skips when the index already exists — never
# wipe a live demo. FLOORWISE_FORCE_SEED=1 is the only rebuild switch.
apiVersion: batch/v1
kind: Job
metadata:
  name: confxarm64-seed
  labels:
    app.kubernetes.io/name: seed
    {{- include "confxarm64.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 8
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seed
        app.kubernetes.io/part-of: confxarm64
    spec:
      restartPolicy: OnFailure
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: {{ .Values.image.api | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["npx", "tsx", "server/seed.ts"]
          envFrom:
            - configMapRef:
                name: {{ include "confxarm64.configMapName" . }}
          env:
            - name: FLOORWISE_SKIP_SEED
              value: "0"
            - name: FLOORWISE_FORCE_SEED
              value: "0"
            - name: ELASTICSEARCH_URL
              value: {{ .Values.elasticsearch.url | quote }}
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
{{- end }}
