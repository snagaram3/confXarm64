apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "confxarm64.configMapName" . }}
  labels:
    app.kubernetes.io/name: confxarm64
    {{- include "confxarm64.labels" . | nindent 4 }}
data:
  ELASTICSEARCH_URL: {{ .Values.elasticsearch.url | quote }}
  ELASTICSEARCH_INDEX: {{ .Values.config.elasticsearchIndex | quote }}
  PORT: {{ .Values.api.port | quote }}
  OTEL_SERVICE_NAME: {{ .Values.config.otelServiceName | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otelExporterEndpoint | quote }}
  FLOORWISE_SKIP_SEED: {{ .Values.api.skipSeed | quote }}
  FLOORWISE_SYNTHETIC_OTEL: {{ .Values.config.syntheticOtel | quote }}
  DASH0_DASHBOARD_URL: {{ .Values.config.dash0.dashboardUrl | quote }}
  DASH0_API_BASE_URL: {{ .Values.config.dash0.apiBaseUrl | quote }}
  DASH0_DATASET: {{ .Values.config.dash0.dataset | quote }}
  SONAR_HOST_URL: {{ .Values.config.sonar.hostUrl | quote }}
  SONAR_PROJECT_KEY: {{ .Values.config.sonar.projectKey | quote }}
  SONAR_ORGANIZATION: {{ .Values.config.sonar.organization | quote }}
  RADAR_UI_URL: {{ .Values.config.radarUiUrl | quote }}
