# Official Dash0 operator values.
# Docs: https://www.dash0.com/docs/dash0/monitoring/kubernetes/dash0-operator/installation
# Repo: helm repo add dash0-operator https://dash0hq.github.io/dash0-operator
#
# This file installs the operator WITHOUT a backend so the chart succeeds with
# no Dash0 account. Export is enabled only when infra/bootstrap.sh or
# infra/local-minikube.sh finds
# secret dash0-system/dash0-auth (key: token) AND you pass:
#   DASH0_OTLP_GRPC_ENDPOINT=ingress.<region>.aws.dash0.com:4317
#   DASH0_API_ENDPOINT=https://api.<region>.aws.dash0.com
#
# Never put the token in this file.

# operator.dash0Export.enabled is NOT set here on purpose.
# bootstrap/local-minikube pass --set operator.dash0Export.enabled=true only when the secret exists.
