# Apply once through Radar MCP (apply_resource) after GHCR images exist and
# are public. Argo CD in the CNH cluster reads this public GitHub repo without
# credentials. Do not commit kubeconfigs. Do not apply if Radar MCP cannot see
# cluster confxarm64 (HTTP 403 means the signed-in email is not on the team).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app
  namespace: team-confxarm64
spec:
  project: team-confxarm64
  source:
    repoURL: https://github.com/snagaram3/confXarm64.git
    targetRevision: main
    path: infra/charts/confxarm64
    helm:
      valueFiles:
        - values.yaml
        - values-cnh.yaml
        - values-images.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: team-confxarm64
  # Live tokens are patched into Secret confxarm64-secrets outside GitOps.
  # Ignore /data so automated selfHeal cannot replace them with empty placeholders.
  # Do not ignore ConfigMap confxarm64-config — public Dash0 URLs live in values-cnh.yaml.
  ignoreDifferences:
    - kind: Secret
      name: confxarm64-secrets
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
