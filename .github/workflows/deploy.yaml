# On every push to main: build web + api images, push them to GHCR (lowercase),
# and point infra/charts/confxarm64/values-images.yaml at the new tags.
# Argo CD watches this public repo and deploys the Helm chart.
name: build-and-deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - infra/charts/confxarm64/values-images.yaml
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: build-and-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Image names and tag
        id: meta
        run: |
          repo_lower="${GITHUB_REPOSITORY,,}"
          echo "web=ghcr.io/${repo_lower}" >> "$GITHUB_OUTPUT"
          echo "api=ghcr.io/${repo_lower}-api" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.web }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.web }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.api }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.api }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Point the Helm chart at the new images
        env:
          WEB_IMAGE: ${{ steps.meta.outputs.web }}:${{ steps.meta.outputs.tag }}
          API_IMAGE: ${{ steps.meta.outputs.api }}:${{ steps.meta.outputs.tag }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Set the images on top of the latest main, not on the commit this run
          # built, so a concurrent push cannot conflict. Retry if one lands mid-push.
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard FETCH_HEAD
            python3 - <<'PY'
          from pathlib import Path
          import os
          path = Path("infra/charts/confxarm64/values-images.yaml")
          path.write_text(
              "# Managed by .github/workflows/deploy.yaml. Do not hand-edit image tags.\n"
              "image:\n"
              f"  api: {os.environ['API_IMAGE']}\n"
              f"  web: {os.environ['WEB_IMAGE']}\n"
          )
          PY
            if git diff --quiet; then exit 0; fi
            git commit -qam "deploy: ${TAG} [skip ci]"
            if git push -q origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          echo "Couldn't push the deploy commit after 5 tries." >&2
          exit 1
