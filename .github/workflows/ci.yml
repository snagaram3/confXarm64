# GitHub Actions CI for confXarm64 (tests + optional Sonar scan).
# This Origin repository has NO GitHub Actions runner. Origin will not execute
# this workflow. A public GitHub repository is required for Gitar and Actions.
# GitHub requires workflows under .github/workflows/ — this file is the Actions
# entry; infra/README.md is the human bootstrap. Local scan:
#   npm test && npm run build
#   ./infra/sonar-scan.sh   # only with SONAR_TOKEN + SONAR_HOST_URL you supply
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  sonar:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.event_name != 'pull_request' && secrets.SONAR_TOKEN != '' && secrets.SONAR_HOST_URL != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarQube / SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=floorwise
